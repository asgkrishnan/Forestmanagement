# Spring Application Configuration
spring.application.name=smart-forest-surveillance
server.port=8080

# Database Configuration (H2 in-memory mode for instant execution, switchable to MySQL)
spring.datasource.url=jdbc:h2:mem:forestdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# H2 Console (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Optional MySQL properties template (for production / local MySQL server)
# spring.datasource.url=jdbc:mysql://localhost:3306/forest_db?useSSL=false&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=root
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Real Copernicus Sentinel-2 Satellite API Credentials
# Get free credentials at: https://dataspace.copernicus.eu
copernicus.client-id=${COPERNICUS_CLIENT_ID:}
copernicus.client-secret=${COPERNICUS_CLIENT_SECRET:}
copernicus.auth-url=https://identity.dataspace.copernicus.eu/auth/realms/CDSE/protocol/openid-connect/token
copernicus.process-url=https://sh.dataspace.copernicus.eu/api/v1/process

# SMS Notification Configuration
# Modes: DEMO (default when keys are missing) or REAL
sms.provider=${SMS_PROVIDER:DEMO}
sms.api-key=${SMS_API_KEY:}
sms.sender-id=${SMS_SENDER_ID:FOREST_ALERT}
